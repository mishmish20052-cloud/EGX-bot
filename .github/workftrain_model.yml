name: Train ML Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 1 * *'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install libraries
        run: pip install -r requirements-ml.txt

      - name: Train model
        run: python ml/train_model.py

      - name: Save model
        run: |
          git config user.name "EGX Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f ml/egx_model.joblib ml/model_meta.json
          git commit -m "Retrain ML model" || echo "No changes"
          git push
